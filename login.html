<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jelajah Dunia</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="page-login">

    <header>
        <h1>JELAJAH DUNIA BERSAMA JEFFRI ANDREAN</h1>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="destinasi.html">Destinasi Wisata</a></li>
                <li><a href="paket.html">Paket Travel</a></li>

                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2 style="text-align: center; border: none;">Login Member</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="username">Username / Email:</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username Anda" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password Anda" required>
                </div>
                <button type="submit">Masuk</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 0.9em;">
                Belum punya akun? <a href="#" style="color: #028090;">Daftar di sini</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Jelajah Dunia Bersama Jeffri Andrean. All rights reserved.</p>
    </footer>

</body>
